<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nick's Cafe</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

	<link rel="stylesheet" href="index.css">
</head>
<body>
	<div class="container mt-5">
		<h1 class="display-2 text-center my-5">
			<img src="images/restaurant.png" width="80" height="80" class="me-3" alt="Restaurant Icon">
			Welcome to <span class="badge text-bg-success">Nick's Cafe</span>
			<img src="images/drinks/martini.png" width="80" height="80" class="ms-3" alt="Restaurant Icon">
		</h1>

		<section id="menu" class="my-5 border rounded p-4 shadow bg-light">
			<h2 class="badge text-bg-success fs-2 d-table mx-auto mb-4">Food Menu</h2>
			<div id="food-menu" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mb-5">
				<!-- Food items rendered here -->
			</div>

			<h2 class="badge text-bg-success fs-2 d-table mx-auto mb-4">Drinks Menu</h2>
			<div id="drinks-menu" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
				<!-- Drink items rendered here -->
			</div>
		</section>

		<div class="row mt-5">
			<div class="col">
				<h3 class="mb-3">Current Order</h3>
				<p id="no-current-order-msg" class="text-muted">No items selected — click menu items to start an order.</p>
				<div id="current-order" class="card order-card mx-auto my-4 d-none">
					<div class="card-header fw-bold d-flex justify-content-between align-items-center">
						<span>Current Order</span>
						<img src="images/logo.png" width="40" height="40" alt="Nick's Cafe Logo">
					</div>
					<div class="card-body">
						<ul id="current-order-lines" class="list-group list-group-flush"></ul>
					</div>
					<div class="card-footer text-center">
						<button type="button" id="place-order-btn" class="btn btn-primary" disabled>Place Order</button>
					</div>
				</div>
			</div>
		</div>

		<div class="row mt-5 mb-5">
			<div class="col">
				<h3 class="mb-3">Order Status</h3>
				<div id="orders-container" class="d-flex flex-wrap gap-3">
					<p id="no-orders-msg" class="text-muted">No orders yet — select items from the menu and place an order.</p>
					<!-- Placed order summary cards will be dynamically added here -->
				</div>
			</div>
		</div>
	


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODIW" crossorigin="anonymous"></script>
<script src="index.js"></script>
</body>
</html>
